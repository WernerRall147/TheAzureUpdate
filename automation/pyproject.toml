[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "theazureupdate-knowledge"
version = "0.1.0"
description = "Daily, source-grounded post generation for The Azure Update"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[project.scripts]
azure-update-knowledge = "knowledge_workflow.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["knowledge_workflow*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
